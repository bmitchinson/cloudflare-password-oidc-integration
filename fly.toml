# fly.toml app configuration file generated for cloudflare-password-oidc-integration on 2026-05-08T21:54:48-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cloudflare-password-oidc-integration'
primary_region = 'sjc'

[build]

[env]
  CONFIG_PATH = '/data/config.json'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'oidc_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
